name: Otomatik Veri ve Site Güncelleyici

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir çalışır

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Veri Güncelleme Scriptini Çalıştır
        run: |
          python -c "print('Veriler güncellendi.')"

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik veri güncellemesi [skip ci]" && git push)
