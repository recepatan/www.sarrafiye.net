  <!-- JavaScript Kod Alanı -->
  <script>
    const nf2 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt = n => isNaN(n) ? "0,00" : nf2.format(n);

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      document.getElementById('dark_toggle_btn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('gece_modu', isDark ? 'acik' : 'kapali');
    }

    function setT(mainColor, borderColor) {
      document.documentElement.style.setProperty('--main', mainColor);
      document.documentElement.style.setProperty('--border', borderColor);
      localStorage.setItem('secilen_ana_renk', mainColor);
      localStorage.setItem('secilen_kenar_renk', borderColor);
    }

    const DAYS = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    function updateClock() {
      const now = new Date();
      document.getElementById('tarih_alan').innerText = `${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}, ${DAYS[now.getDay()]}`;
    }

    let socket = null;
    const prevPrices = new Map();

    function connectSocket() {
      // Doğrudan wss://socket.sarrafiye.net bağlantısı
      socket = io.connect('wss://socket.sarrafiye.net', { transports: ["websocket"] });

      socket.on('connect', () => {
        document.getElementById('connection_status_icon').style.color = '#16a34a';
        document.getElementById('connection_status_icon').title = 'Canlı Bağlantı Aktif';
        document.getElementById('status').style.display = 'none';
        document.getElementById('results').style.display = 'flex';
      });

      socket.on('disconnect', () => {
        document.getElementById('connection_status_icon').style.color = '#dc2626';
        document.getElementById('connection_status_icon').title = 'Bağlantı Kesildi';
      });

      socket.on('connect_error', () => {
        document.getElementById('connection_status_icon').style.color = '#dc2626';
      });

      // Socket'ten gelen ham verileri dinle
      socket.on('price_changed', handleSocketData);
      socket.on('price_changes', handleSocketData);
    }

    function handleSocketData(response) {
      try {
        let dataObj = null;
        if (response && response.data) {
          dataObj = response.data;
        } else if (Array.isArray(response) && response[1] && response[1].data) {
          dataObj = response[1].data;
        } else if (typeof response === 'object') {
          dataObj = response;
        }

        if (dataObj) {
          renderDynamicPrices(dataObj);
        }

        if (response?.meta?.time) {
          const d = new Date(response.meta.time);
          document.getElementById('fiyat_zaman_doviz').innerText = d.toTimeString().split(' ')[0];
        } else {
          const now = new Date();
          document.getElementById('fiyat_zaman_doviz').innerText = now.toTimeString().split(' ')[0];
        }
      } catch (e) {
        console.error('Veri işleme hatası:', e);
      }
    }

    function renderDynamicPrices(dataObj) {
      const grup1Body = document.getElementById('grup1TableBody');
      const marketBody = document.getElementById('marketTableBody');
      const specialBody = document.getElementById('specialProductsTableBody');

      // İlk veri geldiğinde yükleniyor yazısını gizle
      document.getElementById('status').style.display = 'none';
      document.getElementById('results').style.display = 'flex';

      Object.keys(dataObj).forEach(code => {
        const item = dataObj[code];
        if (!item) return;

        let alis = item.alis !== undefined ? item.alis : '---';
        let satis = item.satis !== undefined ? item.satis : '---';

        // Sayısal değerleri formatla
        const formattedAlis = !isNaN(alis) ? fmt(parseFloat(alis)) : alis;
        const formattedSatis = !isNaN(satis) ? fmt(parseFloat(satis)) : satis;

        let rowId = `row-${code}`;
        let tr = document.getElementById(rowId);

        if (!tr) {
          tr = document.createElement('tr');
          tr.id = rowId;
          tr.innerHTML = `
            <td style="font-weight: bold;">${code}</td>
            <td style="color:#2563eb; font-weight:bold; text-align:center;"><span id="alis-${code}">${formattedAlis}</span></td>
            <td style="color:#d97706; font-weight:bold; text-align:center;"><span id="satis-${code}">${formattedSatis}</span></td>
          `;

          // Kod türüne göre uygun tabloya yerleştir
          if (code.includes('TRY') || code === 'USD' || code === 'EUR') {
            marketBody.appendChild(tr);
          } else if (code === 'ONS' || code === 'GUMUS') {
            specialBody.appendChild(tr);
          } else {
            grup1Body.appendChild(tr);
          }
        } else {
          document.getElementById(`alis-${code}`).innerText = formattedAlis;
          document.getElementById(`satis-${code}`).innerText = formattedSatis;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('gece_modu');
      if (savedTheme === 'kapali') {
        document.body.classList.remove('dark-mode');
        document.getElementById('dark_toggle_btn').innerText = '🌙';
      }

      const mainColor = localStorage.getItem('secilen_ana_renk');
      const borderColor = localStorage.getItem('secilen_kenar_renk');
      if (mainColor && borderColor) {
        setT(mainColor, borderColor);
      }

      connectSocket();
      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
